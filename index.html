<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Фортуна в рюмке</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 data-i18n="title">Фортуна в рюмке</h1>
    <p data-i18n="subtitle">Нажми кнопку и узнай, что ждёт тебя сегодня...</p>
    <button onclick="showFortune()" id="fortuneBtn" data-i18n="button">Налить!</button>
    <div id="result" class="result-box"></div>
    <div class="language-switcher">
      <button onclick="setLanguage('ru')">RU</button>
      <button onclick="setLanguage('en')">EN</button>
      <button onclick="setLanguage('de')">DE</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
